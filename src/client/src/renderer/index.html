<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>go-mapi Client</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="header-content">
          <h1>📧 go-mapi</h1>
          <div class="header-actions">
            <button id="settings-btn" class="btn-icon" title="Settings">⚙️</button>
            <button id="refresh-btn" class="btn-icon" title="Refresh">🔄</button>
          </div>
        </div>
      </header>

      <main class="app-main">
        <div id="empty-state" class="empty-state">
          <div class="empty-state-content">
            <p>No pending emails</p>
            <p class="empty-state-hint">Emails captured via MAPI will appear here</p>
          </div>
        </div>

        <div id="queue-list" class="queue-list" style="display: none;">
          <!-- Mail items will be inserted here -->
        </div>
      </main>

      <div id="details-panel" class="details-panel" style="display: none;">
        <div class="details-header">
          <button id="close-details" class="btn-close">&times;</button>
          <h2>Email Details</h2>
        </div>

        <div class="details-content">
          <div class="detail-group">
            <label>From:</label>
            <p id="detail-from"></p>
          </div>

          <div class="detail-group">
            <label>To:</label>
            <p id="detail-to"></p>
          </div>

          <div class="detail-group" id="cc-group" style="display: none;">
            <label>CC:</label>
            <p id="detail-cc"></p>
          </div>

          <div class="detail-group" id="bcc-group" style="display: none;">
            <label>BCC:</label>
            <p id="detail-bcc"></p>
          </div>

          <div class="detail-group">
            <label>Subject:</label>
            <p id="detail-subject"></p>
          </div>

          <div class="detail-group">
            <label>Body:</label>
            <div id="detail-body" class="detail-body"></div>
          </div>

          <div class="detail-group" id="attachments-group" style="display: none;">
            <label>Attachments:</label>
            <ul id="detail-attachments" class="attachments-list"></ul>
          </div>

          <div class="detail-group">
            <label>Origin:</label>
            <p id="detail-origin"></p>
          </div>
        </div>

        <div class="details-actions">
          <button id="send-btn" class="btn btn-primary">Send via Gmail</button>
          <button id="delete-btn" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
