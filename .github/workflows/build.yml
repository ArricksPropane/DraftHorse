name: Build and Test

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  build-interceptor:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # Install MinGW and Ninja
      - name: Install MinGW and Ninja
        run: |
          choco install mingw ninja cmake --no-progress -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH

      # Build C++ Interceptor and Tests
      - name: Build Interceptor and Test Harness
        working-directory: src/interceptor
        run: |
          .\build.ps1 -Config ${{ matrix.config }} -Tests -Clean

      # Run Tests
      - name: Run Test Harness
        working-directory: src/interceptor
        run: |
          .\build\bin\go-mapi-test-harness.exe .\build\bin\go-mapi.dll
        continue-on-error: true

      # Upload artifacts
      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-dll-${{ matrix.config }}
          path: src/interceptor/build/bin/go-mapi.dll
          if-no-files-found: warn

      - name: Upload Test Harness Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-mapi-tests-${{ matrix.config }}
          path: src/interceptor/build/bin/go-mapi-test-harness.exe
          if-no-files-found: warn

  build-client:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Node.js for Electron client
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build Electron Client
      - name: Install Client Dependencies
        working-directory: src/client
        run: npm install

      - name: Build Client TypeScript
        working-directory: src/client
        run: npm run build
