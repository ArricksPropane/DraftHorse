name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Build C++ Interceptor
      - name: Install MinGW and Ninja
        run: |
          choco install mingw ninja cmake --no-progress -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH

      - name: Build Interceptor DLL
        working-directory: src/interceptor
        run: .\build.ps1 -Config Release -Clean
        # Version is read from package.json by build.ps1 automatically

      # Build Go Native Host
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Native Messaging Host
        working-directory: src/native-host
        run: |
          go mod tidy
          go build -ldflags "-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" -o build/go-mapi-host.exe .

      # Build Browser Extension
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Extension
        working-directory: src/extension
        run: |
          npm install
          npm run build

      # Package extension as zip
      - name: Package Extension
        shell: bash
        run: |
          cd src/extension/dist
          7z a -tzip ../../../go-mapi-extension-${{ steps.version.outputs.VERSION }}.zip .

      # Create Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src/interceptor/build/bin/go-mapi.dll
            src/native-host/build/go-mapi-host.exe
            go-mapi-extension-${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
