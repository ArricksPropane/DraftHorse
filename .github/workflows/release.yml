name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ./.github/workflows/build.yml

  release:
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SEMVER="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "SEMVER=$SEMVER" >> $GITHUB_OUTPUT

      # Build C++ Interceptor
      - name: Install MinGW and Ninja
        run: |
          choco install mingw ninja cmake --no-progress -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH

      - name: Build Interceptor DLL
        working-directory: src/interceptor
        run: .\build.ps1 -Config Release -Clean

      # Build Go Native Host
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Native Messaging Host
        working-directory: src/native-host
        run: |
          go mod tidy
          go build -ldflags "-s -w -X main.Version=${{ steps.version.outputs.SEMVER }}" -o build/go-mapi-host.exe .

      # Build Browser Extension
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build:extension

      # Package release assets
      - name: Package Extension
        shell: bash
        run: |
          cd src/extension/dist
          7z a -tzip ../../../go-mapi-extension-${{ steps.version.outputs.TAG }}.zip .

      - name: Package Install Script
        shell: bash
        run: |
          7z a -tzip go-mapi-scripts-${{ steps.version.outputs.TAG }}.zip \
            scripts/install.ps1

      # Create Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: go-mapi ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.TAG, 'alpha') || contains(steps.version.outputs.TAG, 'beta') }}
          files: |
            src/interceptor/build/bin/go-mapi.dll
            src/native-host/build/go-mapi-host.exe
            go-mapi-extension-${{ steps.version.outputs.TAG }}.zip
            go-mapi-scripts-${{ steps.version.outputs.TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
