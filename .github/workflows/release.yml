name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Install MinGW and Ninja
      - name: Install MinGW and Ninja
        run: |
          choco install mingw ninja cmake --no-progress -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH

      # Build C++ DLL
      - name: Build Interceptor DLL
        working-directory: src/interceptor
        run: .\build.ps1 -Config Release -Clean

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build Electron Client
      - name: Build Client
        working-directory: src/client
        run: |
          npm install
          npm run build

      # Package installers
      - name: Package Electron App
        working-directory: src/client
        run: npm run dist

      # Upload to Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src/interceptor/build/bin/go-mapi.dll
            src/client/dist/*.exe
            src/client/dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
